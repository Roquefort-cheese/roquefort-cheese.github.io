<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" role="img" aria-labelledby="iz-title iz-desc">
<title id="iz-title">Изолента Серёги</title>
<desc id="iz-desc">Рулон синей изоленты и отклеенный обрывок на сером линолеумном полу, без бликов и подписи.</desc>
<rect width="600" height="400" fill="#c9c4b6"/>
<g stroke="#b3ad9c" stroke-width="1">
<line x1="0" y1="100" x2="600" y2="100"/>
<line x1="0" y1="200" x2="600" y2="200"/>
<line x1="0" y1="300" x2="600" y2="300"/>
<line x1="150" y1="0" x2="150" y2="400"/>
<line x1="300" y1="0" x2="300" y2="400"/>
<line x1="450" y1="0" x2="450" y2="400"/>
</g>
<ellipse cx="300" cy="260" rx="70" ry="30" fill="#2a3f7a"/>
<ellipse cx="300" cy="255" rx="52" ry="20" fill="#33488a"/>
<ellipse cx="300" cy="252" rx="24" ry="9" fill="#c9c4b6"/>
<path d="M300 235 C 340 220, 370 195, 360 165 C 356 178, 336 190, 312 198" fill="none" stroke="#2a3f7a" stroke-width="14" stroke-linecap="round" opacity="0.85"/>
<path d="M357 168 l14 -10 l4 12 l-13 9 z" fill="#233469"/>
<text x="300" y="360" text-anchor="middle" font-family="Georgia, serif" font-size="16" fill="#4a473e">резинка отвалилась — никто не засмеялся первым</text>
</svg>
