<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" role="img" aria-labelledby="an-title an-desc">
<title id="an-title">Архонт Недосланного</title>
<desc id="an-desc">Силуэт на нижней койке, удлинитель обмотан вокруг руки как чётки, под грудиной светится пиксельное «печатает…», нимб собран из значков непрочитанных уведомлений.</desc>
<rect width="600" height="400" fill="#7a6a4a"/>
<rect x="0" y="0" width="600" height="400" fill="#8f7c56" opacity="0.4"/>
<rect x="40" y="300" width="520" height="18" fill="#5f5238"/>
<rect x="60" y="230" width="480" height="80" rx="6" fill="#4d4330"/>
<g fill="none" stroke="#2ee6c8" stroke-width="2" opacity="0.85">
<circle cx="300" cy="150" r="10"/>
<circle cx="330" cy="140" r="7"/>
<circle cx="270" cy="140" r="7"/>
<circle cx="300" cy="120" r="6"/>
<circle cx="345" cy="160" r="5"/>
<circle cx="255" cy="160" r="5"/>
</g>
<path d="M270 300 C 260 250, 270 210, 300 200 C 330 210, 340 250, 330 300 Z" fill="#2b2620"/>
<rect x="290" y="230" width="20" height="26" fill="#0d0b08"/>
<rect x="292" y="234" width="16" height="4" fill="#2ee6c8"/>
<rect x="292" y="240" width="10" height="4" fill="#2ee6c8" opacity="0.7"/>
<rect x="292" y="246" width="13" height="4" fill="#2ee6c8" opacity="0.5"/>
<path d="M255 300 C 250 270, 260 250, 250 230 C 240 250, 248 270, 240 300" fill="none" stroke="#3a3226" stroke-width="10" stroke-linecap="round"/>
<circle cx="252" cy="228" r="6" fill="#3a3226"/>
<text x="300" y="360" text-anchor="middle" font-family="Georgia, serif" font-size="16" fill="#efe9db">нимб из непрочитанных уведомлений</text>
</svg>
